# Fly.io deployment of Server/ (tdr/0032). Lives at the repo root because the
# Docker build needs Packages/ next to Server/. Deploy with `fly deploy`.
# PRODUCTION app: release builds (TestFlight, App Store) talk to it, so the
# leaderboard goes to CloudKit Production. The dev app is fly.dev.toml.
# Secrets go through `fly secrets set -a forever-alone-poker`, never this file:
# SESSION_SECRET, CLOUDKIT_KEY_ID (the Production key), CLOUDKIT_PRIVATE_KEY,
# CATALOG_SIGNING_KEY, APPLE_TEAM_ID, APPLE_SIGNIN_KEY_ID,
# APPLE_SIGNIN_PRIVATE_KEY.

app = "forever-alone-poker"
primary_region = "iad"

[env]
  # Must match the CloudKit environment the app reads the leaderboard from.
  CLOUDKIT_ENVIRONMENT = "production"
  # The catalog key the app pins in Info.plist SkinCatalogPublicKeys.
  CATALOG_KEY_ID = "2026-11"

[build]
  dockerfile = "Server/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory: stopping a machine drops every table and socket.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
